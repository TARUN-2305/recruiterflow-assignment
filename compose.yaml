# Optional local infrastructure for the Recruiter Bot (Section B).
# Usage: copy .env.example to .env, then `docker compose up -d db`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: recruiter_bot
    ports:
      # Bound to localhost only: the dev database is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created (reset with `docker compose down -v`).
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d recruiter_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
