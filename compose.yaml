# Optional local infrastructure for the Recruiter Bot (Section B).
# Copy .env.example to .env first, then either:
#   docker compose up -d db          # just PostgreSQL; run the API on the host (backend/README.md)
#   docker compose up -d --build     # PostgreSQL + the API container on http://127.0.0.1:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: recruiter_bot
    ports:
      # Bound to localhost only: the dev database is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created (reset with `docker compose down -v`).
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d recruiter_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is "db". The password must be URL-safe.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/recruiter_bot
      SQL_DETECTIVE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/hiring_ops
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  pgdata:
