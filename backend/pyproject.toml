# Tool configuration only. Dependencies are pinned in requirements.txt / requirements-dev.txt.
[project]
name = "recruiter-bot"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S608 flags SQL built with string formatting: every runtime value must be a bound parameter.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "scripts", "tests"]
